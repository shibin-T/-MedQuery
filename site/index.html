/* ===== On-device AI ===== */

<title>MedQuery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single large search bar centred on an empty page; live suggestions with pictures drop down directly beneath it; answers appear below only after a search */
:root{
  --paper:#f3f6f8; --card:#ffffff; --ink:#132433; --muted:#5a6b78; --rule:#d6dfe6;
  --accent:#1c5d8c; --accent-ink:#ffffff; --accent-soft:#e2eef7;
  --warn:#a3361f; --warn-soft:#fbe9e4;
  /* vacutainer cap colours, used as kind markers */
  --cap-disease:#c0392b; --cap-test:#7b5ea7; --cap-drug:#b8860b; --cap-q:#2f7d5b;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e161d; --card:#15212b; --ink:#e4ecf2; --muted:#93a5b3; --rule:#263643;
  --accent:#6fb3e3; --accent-ink:#0b1620; --accent-soft:#1b3346;
  --warn:#f08a70; --warn-soft:#3a1f19;
  --cap-disease:#e8695a; --cap-test:#a98bd6; --cap-drug:#dcb24a; --cap-q:#5cbf90;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e161d; --card:#15212b; --ink:#e4ecf2; --muted:#93a5b3; --rule:#263643;
  --accent:#6fb3e3; --accent-ink:#0b1620; --accent-soft:#1b3346;
  --warn:#f08a70; --warn-soft:#3a1f19;
  --cap-disease:#e8695a; --cap-test:#a98bd6; --cap-drug:#dcb24a; --cap-q:#5cbf90;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{max-width:1018px;margin:0 auto;padding-top:clamp(56px,20vh,200px);display:grid;grid-template-columns:minmax(0,1fr);gap:22px;transition:padding .25s ease}
body.has-results .hero{padding-top:24px;gap:14px}
.brand{text-align:center}
.brand h1{font-family:var(--f-display);font-weight:650;font-size:clamp(2.4rem,7vw,3.6rem);margin:0;letter-spacing:-.015em;line-height:1}
.brand h1 span{color:var(--accent)}
body.has-results .brand h1{font-size:1.8rem}

.searchbox{position:relative}
form.search{display:flex;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);min-height:56px;position:relative;z-index:3}
form.search svg.lens{flex:none;margin-left:22px;color:var(--muted)}
form.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:clamp(1.05rem,2.4vw,1.3rem);padding:12px 16px}
form.search input::placeholder{color:var(--muted)}
form.search input:focus{outline:none}
form.search input::-webkit-search-cancel-button{display:none}
form.search:focus-within{box-shadow:0 0 0 4px var(--accent-soft)}
form.search button{align-self:stretch;border:0;background:var(--ink);color:var(--paper);font:600 1.05rem var(--f-body);padding:0 30px;cursor:pointer;border-radius:0 calc(var(--r) - 3px) calc(var(--r) - 3px) 0}
form.search button:hover{background:var(--accent);color:var(--accent-ink)}
body.open form.search{border-radius:var(--r) var(--r) 0 0;border-bottom-color:var(--rule)}
body.open form.search button{border-bottom-right-radius:0}
@media (max-width:520px){form.search button{padding:0 18px}form.search svg.lens{margin-left:14px}}

/* suggestion panel */
.sugg{position:absolute;left:0;right:0;top:100%;z-index:2;background:var(--card);border:2px solid var(--ink);border-top:0;border-radius:0 0 var(--r) var(--r);box-shadow:0 18px 40px -18px rgba(10,25,40,.35);max-height:min(70vh,560px);overflow-y:auto}
.sugg-head{display:flex;justify-content:space-between;gap:10px;padding:10px 18px 6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sugg ul{list-style:none;margin:0;padding:0 8px 8px}
.opt{display:flex;align-items:center;gap:14px;padding:8px 10px;border-radius:10px;cursor:pointer}
.opt[aria-selected="true"],.opt:hover{background:var(--accent-soft)}
.pic{flex:none;width:60px;height:60px;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden}
.pic::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--kc) 30%,transparent)}
.pic svg{width:38px;height:38px}
.opt-text{min-width:0;display:grid;gap:1px}
.opt-term{font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-term mark{background:none;color:var(--accent);font-weight:700}
.opt-sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-kind{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
@media (max-width:520px){.sugg-head span:last-child{display:none}.opt-kind span{display:none}.pic{width:50px;height:50px}.pic svg{width:32px;height:32px}}
.sugg .divider{padding:10px 18px 4px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.sugg .divider .dots::after{content:"…";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.cap{width:10px;height:10px;border-radius:3px 3px 5px 5px;display:inline-block;flex:none}

#results{margin-top:28px}
main.grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:28px;align-items:start}
@media (max-width:860px){main.grid{grid-template-columns:minmax(0,1fr)}}

.report{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;min-width:0}
.report-head{padding:20px 22px 16px;border-bottom:1px solid var(--rule);display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kind{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.report h2{font-family:var(--f-display);font-weight:650;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.15;margin:0;text-wrap:balance}
.aka{color:var(--muted);font-size:.9rem}
.summary{font-size:1.05rem;max-width:68ch;margin:4px 0 0}
.alert{margin:16px 22px 0;padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);font-size:.92rem}
.alert strong{color:var(--warn);display:block;font-size:.72rem;font-family:var(--f-mono);letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;margin:16px 22px 0;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.fact{padding:10px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -1px -1px 0;min-width:0}
.fact dt{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fact dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sections{padding:8px 22px 22px;display:grid;gap:4px}
.sec{border-top:1px solid var(--rule);padding-top:16px;margin-top:14px}
.sec:first-child{border-top:0;margin-top:6px}
.sec h3{font-family:var(--f-mono);font-size:.74rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.sec p{margin:0 0 8px;max-width:68ch}
.sec ul{margin:0;padding-left:1.15em;max-width:68ch;display:grid;gap:4px}
.tbl{overflow-x:auto;margin-top:10px;border:1px solid var(--rule);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;background:color-mix(in srgb,var(--paper) 60%,var(--card))}
.tbl tr:last-child td{border-bottom:0}
.tbl td{font-variant-numeric:tabular-nums}
.evidence{margin:0 22px 18px;padding:10px 14px;background:var(--accent-soft);border-radius:8px;font-size:.88rem}
.evidence h4{margin:0 0 6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.evidence ul{margin:0;padding-left:1.1em}
.conf{display:inline-block;font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:4px;border:1px solid currentColor}
.followup{border-top:1px solid var(--rule);padding:16px 22px 20px;display:grid;gap:10px}
.followup .related{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;font:500 .83rem var(--f-body);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
form.fu{display:flex;gap:8px}
form.fu input{flex:1;min-width:0;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:.95rem}
form.fu button{border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:0 14px;font:600 .88rem var(--f-body);cursor:pointer}
.disclaimer{padding:12px 22px 16px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--muted)}
.loading{padding:28px 22px;display:grid;gap:14px}
.loading .q{font-family:var(--f-display);font-size:1.4rem;font-weight:500}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.steps li.on{color:var(--ink)}
.steps li::before{content:"○ "}
.steps li.on::before{content:"● ";color:var(--accent)}
.bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.bar i,.sugg .divider .dots::after{animation:none}.bar i{width:100%;opacity:.5}.hero{transition:none}}
.stop{justify-self:start;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:6px;padding:6px 12px;font:500 .85rem var(--f-body);cursor:pointer}
.err{padding:22px;display:grid;gap:10px}
aside.rail{min-width:0}
.panel{border-top:2px solid var(--ink);padding-top:10px}
.panel h4{margin:0 0 8px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.panel p{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.srcs{list-style:none;padding:0;margin:0;display:grid}
.srcs li{border-bottom:1px solid var(--rule)}
.srcs a{display:flex;justify-content:space-between;gap:8px;padding:8px 0;text-decoration:none;color:var(--ink);font-size:.9rem}

.srcs a:hover{color:var(--accent)}
.lvl{border:1px solid var(--rule);padding:1px 8px;border-radius:4px}
.sec h4{margin:0 0 4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px}
.note{font-size:.85rem;color:var(--muted);margin:6px 0 0!important}
.remedies{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.remedy{border:1px solid var(--rule);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.remedy p{margin:0!important;font-size:.92rem}
.remedy-name{font-weight:600}
.allergen{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:7px 9px;font-size:.84rem;border-left:3px solid var(--warn)}
.allergen b{color:var(--warn)}
.no-allergen{font-size:.8rem;color:var(--muted)}
.curbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.88rem;color:var(--muted)}
.curbar select,.field select,.field input{font:inherit;font-size:.92rem;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:7px 10px}
.money{white-space:nowrap;font-weight:600}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.dep{color:var(--cap-test);font-weight:700}
.factors{margin-top:12px;border:1.5px solid var(--cap-test);border-radius:12px;padding:14px;display:grid;gap:12px;background:color-mix(in srgb,var(--cap-test) 7%,var(--card))}
.fac-head{font-size:.92rem}
.fields{display:flex;flex-wrap:wrap;gap:12px}
.field{display:grid;gap:4px;min-width:130px;flex:1 1 130px}
.field label{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fac-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.more{padding:4px 22px 18px}
.more-btn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;font:600 .95rem var(--f-body);cursor:pointer}
.more-btn span{font-weight:400;font-size:.78rem;opacity:.8}
.more-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.more-btn.ghost{background:transparent;color:var(--ink)}
.more-btn.small{padding:8px 14px;font-size:.88rem}
.more-btn:disabled{opacity:.6;cursor:wait}
details.evidence summary{cursor:pointer;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
details.evidence ul{margin-top:8px}
.define{position:fixed;z-index:50;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;padding:12px 14px 14px;box-shadow:0 14px 36px -12px rgba(10,25,40,.45);display:grid;gap:4px}
.def-term{font-family:var(--f-display);font-weight:650;font-size:1.15rem;padding-right:24px}
.def-body{margin:0;font-size:.92rem}
.def-x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:4px}
.def-more{font-size:.85rem;margin-top:4px}
.report ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.figma-badge{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px 10px 4px 22px;pointer-events:none}
.figma-badge::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--cap-q)}
.logo{display:inline-block;cursor:pointer;user-select:text;-webkit-user-select:text;border-radius:14px;padding:4px 14px;transition:background .15s ease,box-shadow .15s ease}
.logo:hover,.logo:focus-visible{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.logo:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.logo ::selection{background:var(--accent);color:var(--accent-ink)}
.about{position:fixed;z-index:45;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));max-height:min(78vh,620px);display:flex;flex-direction:column;gap:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:16px;padding:16px 16px 14px;box-shadow:0 22px 50px -18px rgba(10,25,40,.45)}
.about-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.about-title{font-family:var(--f-display);font-weight:650;font-size:1.3rem}
.about-brand span{color:var(--accent)}
.about-x{border:0;background:none;color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;padding:2px 6px}
.about-lede{margin:0;font-size:.95rem}
.about-list{margin:0;padding-left:1.1em;font-size:.88rem;display:grid;gap:3px}

.about-log{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.about-log:empty{display:none}

.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper)}
.msg.bot{align-self:flex-start;background:var(--accent-soft)}
.about-form{display:flex;gap:8px}

<script>
(() => {
  const $ = s => document.querySelector(s);
  const SVGNS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  const str = v => (v == null ? "" : String(v)).trim();
  const arr = v => Array.isArray(v) ? v : [];

  const KINDS = {
    disease: { label: "Disease", color: "var(--cap-disease)" },
    test:    { label: "Test", color: "var(--cap-test)" },
    drug:    { label: "Medicine", color: "var(--cap-drug)" },
    question:{ label: "Question", color: "var(--cap-q)" }
  };
  let mode = "auto", sample = null, sampleChecked = false, ctl = null, current = null;

  const SOURCES = [
    { name: "Europe PMC (open access only)", tag: "free full text", url: q => "https://europepmc.org/search?query=(" + q + ")%20AND%20(OPEN_ACCESS%3Ay)" },
    { name: "PubMed (free full text)", tag: "research", url: q => "https://pubmed.ncbi.nlm.nih.gov/?term=" + q + "&filter=simsearch2.ffrft" },
    { name: "Cochrane reviews (via PubMed)", tag: "evidence", url: q => "https://pubmed.ncbi.nlm.nih.gov/?term=(" + q + ")%20AND%20%22Cochrane%20Database%20Syst%20Rev%22%5Bjournal%5D" },
    { name: "MedlinePlus (NIH)", tag: "patient", url: q => "https://vsearch.nlm.nih.gov/vivisimo/cgi-bin/query-meta?v%3Aproject=medlineplus&query=" + q },
    { name: "NCBI Bookshelf / StatPearls", tag: "clinical", url: q => "https://www.ncbi.nlm.nih.gov/books/?term=" + q },
    { name: "DailyMed (FDA labels)", tag: "drugs", url: q => "https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=" + q },
    { name: "CDC", tag: "public health", url: q => "https://search.cdc.gov/search/?query=" + q },
    { name: "WHO", tag: "global", url: q => "https://www.who.int/home/search-results?indexCatalogue=genericsearchindex1&searchQuery=" + q },
    { name: "PLOS Medicine", tag: "open journal", url: q => "https://journals.plos.org/plosmedicine/search?q=" + q },
    { name: "Global Index Medicus (WHO)", tag: "low/middle-income research", url: q => "https://pesquisa.bvsalud.org/gim/?lang=en&q=" + q },
    { name: "UK Biobank studies", tag: "500,000-person cohort", url: q => "https://europepmc.org/search?query=(" + q + ")%20AND%20%22UK%20Biobank%22%20AND%20(OPEN_ACCESS%3Ay)" },
    { name: "1000 Genomes Project (Ensembl)", tag: "genetics", url: q => "https://www.ensembl.org/Human/Search/Results?q=" + q + ";site=ensembl;facet_species=Human" },
    { name: "CDC WONDER", tag: "US statistics", url: () => "https://wonder.cdc.gov/" },
    { name: "HealthData.gov", tag: "US datasets", url: q => "https://healthdata.gov/browse?q=" + q }
  ];
  // Where a named source's "Read" link should go when the answer has no direct article link
  function sourceLink(source, title) {
    const q = encodeURIComponent(title.slice(0, 160)), src = source.toLowerCase();
    if (/cdc wonder/.test(src)) return "https://wonder.cdc.gov/";
    if (/healthdata\.gov/.test(src)) return "https://healthdata.gov/browse?q=" + q;
    if (/global index medicus|\bgim\b|lilacs|imsear|african index medicus|imemr|wprim/.test(src)) return "https://pesquisa.bvsalud.org/gim/?lang=en&q=" + q;
    if (/1000 genomes/.test(src)) { const rs = title.match(/\brs\d+\b/i); return rs ? "https://www.ensembl.org/Homo_sapiens/Variation/Population?v=" + rs[0].toLowerCase() : "https://www.ensembl.org/Human/Search/Results?q=" + q + ";site=ensembl;facet_species=Human"; }
    if (/uk biobank/.test(src)) return "https://europepmc.org/search?query=" + q + "%20AND%20%22UK%20Biobank%22";
    return "https://europepmc.org/search?query=" + q + "%20AND%20(OPEN_ACCESS%3Ay)";
  }
  function renderSources(term) {
    const q = encodeURIComponent(term);
    $("#srcNote").textContent = "Open “" + term + "” in free, open-access sources.";
    const ul = $("#srcs"); ul.replaceChildren();
    for (const s of SOURCES) ul.append(el("li", {}, el("a", { href: s.url(q), target: "_blank", rel: "noopener" }, s.name, el("span", { text: s.tag + " ↗" }))));

  // ---------- Currency (approximate conversion of USD estimates; INR uses India-specific prices) ----------
  const FX = { USD: [1, "$"], INR: [88, "₹"], EUR: [0.86, "€"], GBP: [0.75, "£"], JPY: [150, "¥"], CNY: [7.1, "CN¥"], AUD: [1.52, "A$"], CAD: [1.38, "C$"], CHF: [0.8, "CHF "], SGD: [1.29, "S$"], AED: [3.67, "AED "], SAR: [3.75, "SAR "], BDT: [122, "৳"], PKR: [282, "Rs "], NPR: [141, "NPR "], LKR: [300, "LKR "], NGN: [1500, "₦"], KES: [129, "KSh "], ZAR: [17.6, "R "], BRL: [5.4, "R$"], MXN: [18.5, "MX$"], RUB: [80, "₽"], IDR: [16300, "Rp "], PHP: [57, "₱"] };
  const TZCUR = { "Asia/Calcutta": "INR", "Asia/Kolkata": "INR", "Europe/London": "GBP", "Asia/Tokyo": "JPY", "Asia/Shanghai": "CNY", "Australia/Sydney": "AUD", "Asia/Dubai": "AED", "Asia/Singapore": "SGD", "Asia/Dhaka": "BDT", "Asia/Karachi": "PKR", "Asia/Kathmandu": "NPR", "Africa/Lagos": "NGN", "Africa/Nairobi": "KES", "Africa/Johannesburg": "ZAR" };
  let currency = (() => { try { const c = localStorage.getItem("medquery.cur"); if (c && FX[c]) return c; } catch {} try { const tz = Intl.DateTimeFormat().resolvedOptions().timeZone; if (TZCUR[tz]) return TZCUR[tz]; if (/^Europe\//.test(tz)) return "EUR"; } catch {} return "USD"; })();
  const num = v => { const n = Number(v); return isFinite(n) && n >= 0 ? n : null; };
  function fmtMoney(lo, hi) {
    const [rate, sym] = FX[currency];
    const f = n => { const v = n * rate; const r = v >= 1000 ? Math.round(v / 10) * 10 : v >= 100 ? Math.round(v) : Math.round(v * 10) / 10; return sym + r.toLocaleString(); };
    if (lo == null && hi == null) return "—";

    if (currency === "INR" && arr(t.inr).length) { const lo = num(t.inr[0]), hi = num(t.inr[1]); if (lo != null || hi != null) return fmtMoney((lo ?? hi) / 88, (hi ?? lo) / 88); }

al sources you are confident exist. Never give personalised dosing. If the query is not medical, use kind "question" and say MedQuery covers medical topics. If it describes an emergency, fill "urgent".

${length}

  function openZoom(card) {
    if (zoom || !card) return;
    const report = $("#report");
    const first = card.getBoundingClientRect();
    const holder = el("div", { class: "zoom-holder", "aria-hidden": "true" }); holder.style.height = first.height + "px";
    card.before(holder);
    const closeBtn = el("button", { class: "zoom-x", type: "button", "aria-label": "Close enlarged view", text: "×" });
    const stage = el("div", { class: "zoom-stage" });
    const layer = el("div", { class: "zoom-layer", role: "dialog", "aria-modal": "true", "aria-label": (card.querySelector("h2,h3")?.textContent || "Section") + ", enlarged" }, stage);
    report.append(layer);
    stage.append(card); card.append(closeBtn);
    card.classList.add("zoomed"); card.style.animation = "none";
    document.documentElement.classList.add("zoom-open");
    // animate from where the block was to the centre
    const last = card.getBoundingClientRect();
    if (!reduceMotion() && last.width) {

    card.focus({ preventScroll: true });

    const root = [decl(t.light || {})];
    const fam = (k, kind) => ty[k]?.family ? (loadFont(ty[k].family), stack(ty[k].family, kind)) : null;
    const fd = fam("Display/Logo", "serif"), fb = fam("Body/Default", "sans"), fm = fam("Mono/Caption", "mono");
    if (fd) root.push("--f-display:" + fd); if (fb) root.push("--f-body:" + fb); if (fm) root.push("--f-mono:" + fm);
    const r = num(t.radius, 0, 40); if (r != null) root.push("--r:" + r + "px");
    css.push(":root{" + root.filter(Boolean).join(";") + "}");
    const d = decl(t.dark || {});
    if (d) css.push(`@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${d}}}`, `:root[data-theme="dark"]{${d}}`);
    const sz = (k, lo, hi) => num(ty[k]?.size, lo, hi), ls = k => { const v = num(ty[k]?.letterSpacing, -20, 40); return v == null ? "" : `letter-spacing:${v / 100}em;`; };
    const wt = k => { const v = num(ty[k]?.weight, 100, 900); return v == null ? "" : `font-weight:${v};`; };
    const lh = k => { const v = num(ty[k]?.lineHeight, 0.8, 3); return v == null ? "" : `line-height:${v};`; };
    if (sz("Display/Logo", 16, 120)) css.push(`.brand h1{font-size:clamp(2.2rem,7vw,${sz("Display/Logo", 16, 120)}px);${ls("Display/Logo")}${wt("Display/Logo")}}`);
    if (sz("Display/Title", 14, 80)) css.push(`.report h2{font-size:clamp(1.4rem,3.6vw,${sz("Display/Title", 14, 80)}px);${ls("Display/Title")}${wt("Display/Title")}}`);
    if (sz("Body/Search", 12, 40)) css.push(`form.search input{font-size:clamp(1.05rem,2.4vw,${sz("Body/Search", 12, 40)}px)}`);
    if (sz("Label/Term", 12, 30)) css.push(`.opt-term{font-size:${sz("Label/Term", 12, 30)}px;${wt("Label/Term")}}`);
    if (sz("Body/Default", 12, 24)) css.push(`body{font-size:${sz("Body/Default", 12, 24)}px;${lh("Body/Default")}}`);
    if (sz("Label/Button", 12, 26)) css.push(`form.search button{font-size:${sz("Label/Button", 12, 26)}px;${wt("Label/Button")}}`);
    styleEl.textContent = css.join("\n");
  }

  function showBadge(text) {
    if (!badge) { badge = document.createElement("div"); badge.className = "figma-badge"; badge.setAttribute("role", "status"); document.body.append(badge); }
    badge.textContent = text;
  }

  // 1. instant: last theme this browser saw
  try { const c = JSON.parse(localStorage.getItem(LKEY) || "null"); if (c) { apply(c); lastJson = JSON.stringify(c); } } catch {}
  const remember = t => { try { localStorage.setItem(LKEY, JSON.stringify(t)); } catch {} };

  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) { if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };
  // ---------- Design tokens panel (#design-tokens): import a Figma variables export without the connector ----------
  const TYPE_NAMES = ["Display/Logo", "Display/Title", "Label/Term", "Body/Search", "Body/Default", "Body/Small", "Mono/Caption", "Mono/Eyebrow", "Label/Button"];
  const KNOWN = [...Object.keys(COLOR_MAP), "radius/lg", ...TYPE_NAMES];
  const WEIGHTS = { thin: 100, extralight: 200, light: 300, regular: 400, normal: 400, medium: 500, semibold: 600, bold: 700, extrabold: 800, black: 900 };
  const to2 = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, "0");
  function toHex(v) {
    if (typeof v === "string") {
      const s = v.trim();
      if (/^#[0-9a-f]{3}$/i.test(s)) return "#" + s.slice(1).split("").map(c => c + c).join("").toLowerCase();
      if (/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(s)) return s.slice(0, 7).toLowerCase();
      const m = /^rgba?\(\s*([\d.]+)[ ,]+([\d.]+)[ ,]+([\d.]+)/i.exec(s); if (m) return "#" + to2(+m[1]) + to2(+m[2]) + to2(+m[3]);
      return null;
    }
    if (v && typeof v === "object" && "r" in v && "g" in v && "b" in v) { const k = Math.max(v.r, v.g, v.b) <= 1 ? 255 : 1; return "#" + to2(v.r * k) + to2(v.g * k) + to2(v.b * k); }
    if (v && typeof v === "object" && typeof v.hex === "string") return toHex(v.hex);
    return null;
  }
  function typoFrom(v) {
    if (typeof v === "string") return parseFont(v);
    if (!v || typeof v !== "object") return null;
    const fam = v.fontFamily || v.family; if (typeof fam !== "string" || !/^[\w .\-]{1,60}$/.test(fam)) return null;
    const size = parseFloat(v.fontSize ?? v.size);
    let weight = v.fontWeight ?? v.weight; weight = typeof weight === "string" && isNaN(+weight) ? WEIGHTS[weight.toLowerCase().replace(/[\s_-]/g, "")] ?? null : parseFloat(weight);
    let lh = v.lineHeight; if (typeof lh === "string") lh = lh.trim().endsWith("%") ? parseFloat(lh) / 100 : parseFloat(lh); if (lh > 3 && size) lh = lh / size;
    let ls = v.letterSpacing; if (typeof ls === "string") ls = ls.trim().endsWith("px") && size ? parseFloat(ls) / size * 100 : parseFloat(ls);
    return { family: fam, size: isFinite(size) ? size : null, weight: isFinite(weight) ? weight : null, lineHeight: isFinite(lh) ? lh : null, letterSpacing: isFinite(ls) ? ls : null };
  }
  // Flatten any common export shape (flat, nested, W3C "$value", Tokens Studio "value", collections, Light/Dark modes)
  function flatten(obj, path = [], out = []) {
    if (!obj || typeof obj !== "object") return out;
    for (const [k, v] of Object.entries(obj)) {
      if (k.startsWith("$") && k !== "$value") continue;
      const p = [...path, k];
      if (v && typeof v === "object" && !Array.isArray(v)) {
        const val = "$value" in v ? v.$value : "value" in v && !("r" in v) ? v.value : undefined;
        if (val !== undefined) out.push([p, val]);
        else if ("r" in v || "fontFamily" in v || "hex" in v) out.push([p, v]);
        else if (v.valuesByMode && typeof v.valuesByMode === "object") { for (const [mode, mv] of Object.entries(v.valuesByMode)) out.push([[...path, mode, v.name || k], mv]); }
        else flatten(v, p, out);
      } else out.push([p, v]);
    }
    return out;
  }
  function parseTokens(text) {
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data.flatMap(x => flatten({ [x?.name || "?"]: x })) : flatten(data);
    const light = {}, dark = {}; let hits = 0;
    for (const [path, val] of list) {
      const segs = path.map(s => String(s).replace(/\./g, "/")).join("/").split("/").map(s => s.trim()).filter(Boolean);
      const isDark = segs.some(s => /dark/i.test(s));
      const name = KNOWN.find(n => { const ns = n.split("/"); return segs.length >= ns.length && ns.every((x, i) => segs[segs.length - ns.length + i].toLowerCase() === x.toLowerCase()); });
      if (!name) continue;
      const target = isDark ? dark : light;
      if (COLOR_MAP[name]) { const h = toHex(val); if (h) { target[name] = h; hits++; } }
      else if (name === "radius/lg") { const r = parseFloat(val); if (isFinite(r)) { light[name] = String(r); hits++; } }
      else { const f = typoFrom(val); if (f) { light[name] = f; hits++; } }
    }
    return { light, dark, hits };
  }
  // Current design as a flat Figma-style token file (for importing into Figma with a variables plugin)
  const LIGHT_DEFAULT = { "bg/paper": "#f3f6f8", "bg/card": "#ffffff", "text/ink": "#132433", "text/muted": "#5a6b78", "border/rule": "#d6dfe6", "accent/default": "#1c5d8c", "accent/on": "#ffffff", "accent/soft": "#e2eef7", "warn/default": "#a3361f", "warn/soft": "#fbe9e4", "kind/disease": "#c0392b", "kind/test": "#7b5ea7", "kind/medicine": "#b8860b", "kind/question": "#2f7d5b" };
  const DARK_DEFAULT = { "bg/paper": "#0e161d", "bg/card": "#15212b", "text/ink": "#e4ecf2", "text/muted": "#93a5b3", "border/rule": "#263643", "accent/default": "#6fb3e3", "accent/on": "#0b1620", "accent/soft": "#1b3346", "warn/default": "#f08a70", "warn/soft": "#3a1f19", "kind/disease": "#e8695a", "kind/test": "#a98bd6", "kind/medicine": "#dcb24a", "kind/question": "#5cbf90" };
  // Current design as a Figma-style token file (Light / Dark groups, Figma variable names)
  function exportTokens() {
    const saved = (() => { try { return JSON.parse(localStorage.getItem(LKEY) || "null"); } catch { return null; } })();
    const Light = {}, Dark = {};
    for (const [n, css] of Object.entries(COLOR_MAP)) { Light[n] = saved?.light?.[css] || LIGHT_DEFAULT[n]; Dark[n] = saved?.dark?.[css] || DARK_DEFAULT[n]; }
    return JSON.stringify({ Light, Dark, "radius/lg": saved?.radius ?? 14 }, null, 2);
  }

  function openTokensPanel() {
    if (document.getElementById("tokens")) return;
    const ta = el("textarea", { id: "tokText", rows: "8", spellcheck: "false", placeholder: '{ "Light": { "bg/paper": "#f3f6f8", "accent/default": "#1c5d8c" }, "Dark": { … } }' });
    const file = el("input", { id: "tokFile", type: "file", accept: ".json,application/json" });
    const status = el("p", { class: "tok-status", "aria-live": "polite" });
    let parsed = null;
    const check = () => {
      try { parsed = parseTokens(ta.value); status.textContent = parsed.hits ? `Found ${parsed.hits} matching tokens (${Object.keys(parsed.dark).length} for dark mode). Preview or save.` : "No matching token names found. Names must match the Figma variables, e.g. bg/paper or accent/default."; }
      catch { parsed = null; status.textContent = ta.value.trim() ? "That isn't valid JSON. Paste the whole exported file." : ""; }
    };
    ta.addEventListener("input", check);
    file.addEventListener("change", async () => { const f = file.files?.[0]; if (f) { ta.value = await f.text(); check(); } });
    const preview = el("button", { type: "button", class: "mini", text: "Preview" });
    const save = el("button", { type: "button", class: "tok-save", text: "Save for everyone" });
    const reset = el("button", { type: "button", class: "mini", text: "Reset to original design" });
    const copy = el("button", { type: "button", class: "mini", text: "Copy current tokens" });
    preview.addEventListener("click", () => { if (!parsed?.hits) return check(); apply(toTheme(parsed.light, parsed.dark)); status.textContent = "Previewing on this screen only. Save to keep it."; });
    save.addEventListener("click", async () => {
      if (!parsed?.hits) return check();
      const t = toTheme(parsed.light, parsed.dark); apply(t); remember(t); lastJson = JSON.stringify(t);
      try { const db = await window.claude?.use?.("db"); if (!db) throw 0; await db.doc("theme/live").set({ theme: t, syncedAt: Date.now(), source: "import" }); status.textContent = "Saved. Everyone who opens MedQuery now sees this design."; }
      catch (e) { status.textContent = e?.code === "permission_denied" ? "Only people who can edit MedQuery can save a design." : "Applied on this device, but it couldn't be saved for everyone here. Open MedQuery inside Claude and try again."; }
    });
    reset.addEventListener("click", async () => {
      styleEl.textContent = ""; try { localStorage.removeItem(LKEY); } catch {} lastJson = "";
      try { const db = await window.claude?.use?.("db"); await db?.doc("theme/live").delete(); status.textContent = "Back to the original design for everyone."; } catch { status.textContent = "Back to the original design on this device."; }
    });
    copy.addEventListener("click", async () => { const j = exportTokens(); try { await navigator.clipboard.writeText(j); status.textContent = "Copied. Import it into Figma with a variables plugin to start from the current design."; } catch { ta.value = j; ta.select(); status.textContent = "Selected below. Press Ctrl+C (or ⌘C) to copy."; } });
    const close = () => { panelEl.remove(); if (location.hash === "#design-tokens") history.replaceState(null, "", location.pathname + location.search); };
    const names = el("details", { class: "tok-names" }, el("summary", { text: "Token names the site understands" }),
      el("p", { text: "Colors: " + Object.keys(COLOR_MAP).join(", ") }),
      el("p", { text: "Corners: radius/lg. Text styles (optional, as Font(…) strings or Tokens Studio typography): " + TYPE_NAMES.join(", ") }),
      el("p", { text: "Put dark-mode colors under a group or collection whose name contains “Dark”." }));
    const panelEl = el("section", { class: "tokens", id: "tokens", role: "dialog", "aria-label": "Design tokens" },
      el("div", { class: "about-head" }, el("div", { class: "about-title", text: "Design tokens" }), el("button", { class: "about-x", type: "button", "aria-label": "Close", text: "×", onclick: close })),
      el("p", { class: "about-lede", text: "Update MedQuery's colors, fonts and corner rounding from Figma without the Figma connector. In Figma, export your variables to JSON with a variables-export plugin, then load the file here." }),
      el("label", { class: "tok-file" }, "Exported JSON file ", file),
      ta, status,
      el("div", { class: "tok-actions" }, save, preview, copy, reset),
      names);
    document.body.append(panelEl);
  }
  const routeTokens = () => { if (location.hash === "#design-tokens") openTokensPanel(); };
  addEventListener("hashchange", routeTokens); routeTokens();


  (async () => {
    const [db, mcp] = await Promise.all([Promise.resolve(window.claude?.use?.("db")).catch(() => null), Promise.resolve(window.claude?.use?.("mcp")).catch(() => null)]);
    const ref = db ? db.doc("theme/live") : null;
    // 2. shared: the theme saved by the owner's last sync
    ref?.onSnapshot(snap => {
      const t = snap.exists ? snap.data()?.theme : null; if (!t) return;
      const j = JSON.stringify(t); if (j === lastJson) return;
      lastJson = j; apply(t); remember(t);
    }, () => {});
    // 3. live: read Figma directly when this viewer has it connected
    // Automatic Figma reads are off: the Figma Starter plan allows only 20 connector calls a month.
    // The theme saved at the last sync still applies for everyone.
    const AUTO_SYNC = false;
    if (!mcp || !AUTO_SYNC) return;
    let light = null, dark = null;
    const onData = async () => {
      if (!light) return;
      const t = toTheme(light, dark || {});
      const j = JSON.stringify(t);
      showBadge("Live from Figma · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      if (j === lastJson) return;
      lastJson = j; apply(t); remember(t);
      try { await ref?.set({ theme: t, syncedAt: Date.now() }); } catch {}
    };
    const watch = (nodeId, set) => mcp.watchTool("Figma", "get_variable_defs", { fileKey: FILE, nodeId }, ev => {
      if (ev.type === "data") { const p = payloadOf(ev.result); if (p) { set(p); onData(); } }
      else if (["needs_reauth", "server_not_connected", "not_in_manifest", "blocked_by_policy", "not_granted"].includes(ev.error?.code)) { if (badge) badge.remove(), badge = null; }
    }, { refetchInterval: 30000, cache: { staleTime: 20000 } });
    watch(LIGHT, p => { light = p; });
    watch(DARK, p => { dark = p; });
  })();
})();
</script>
